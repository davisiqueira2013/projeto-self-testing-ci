[project]
name = "wallet-api"
version = "0.1.0"
description = "Wallet API - microsserviço financeiro com suíte self-testing e CI"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: testes de lógica pura (base da pirâmide)",
    "integration: serviços + SQLite em memória + test doubles",
    "e2e: fluxo completo via requisições HTTP",
]

[tool.coverage.run]
source = ["src/wallet"]
branch = true
omit = ["src/wallet/main.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85
exclude_also = ["if TYPE_CHECKING:", "def __repr__", "\\.\\.\\."]

[tool.coverage.html]
directory = "reports/coverage/html"

[tool.coverage.xml]
output = "reports/coverage/coverage.xml"

[tool.coverage.json]
output = "reports/coverage/coverage.json"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["reports"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PT", "RUF", "C90"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B017"]
